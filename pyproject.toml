[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-cube"
version = "0.14.0"
description = "3D cellular automaton with emergent ecology: stone, light, water, competing species"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
render = ["matplotlib>=3.7"]
gpu = ["cupy-cuda12x[ctk]"]
web = ["aiohttp>=3.9"]
dev = ["pytest>=7", "matplotlib>=3.7", "aiohttp>=3.9", "playwright>=1.40"]

[project.scripts]
life-cube = "life_cube.cli:main"

[tool.setuptools.packages.find]
include = ["life_cube*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"life_cube.viewers.web" = ["static/*"]
